<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Risk Default Underwriting System</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --accent: #10b981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background: var(--bg); color: var(--text-main); min-height: 100vh; padding: 2rem 1rem; }
        .container { max-width: 860px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 2rem; }
        .header h1 { font-size: 2rem; margin-bottom: 0.5rem; color: #fff; }
        .header p { color: var(--text-muted); font-size: 1rem; }
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 2rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.25rem; margin-bottom: 1.5rem; }
        .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
        label { font-size: 0.875rem; font-weight: 500; color: #cbd5e1; }
        input, select { background: #0f172a; border: 1px solid var(--border); color: #fff; padding: 0.65rem 0.85rem; border-radius: 6px; font-size: 0.95rem; }
        input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px rgba(59,130,246,0.2); }
        .btn-submit { display: block; width: 100%; background: var(--primary); color: white; border: none; padding: 0.85rem; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .btn-submit:hover { background: var(--primary-hover); }
        .meta-links { text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--text-muted); }
        .meta-links a { color: var(--primary); text-decoration: none; margin: 0 0.5rem; }
        .meta-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Credit Default Risk Assessment</h1>
            <p>Machine Learning Underwriting Engine with Explainable SHAP Attribution</p>
        </div>

        <div class="card">
            <form action="/predict_ui" method="POST">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="income">Annual Income ($)</label>
                        <input type="number" id="income" name="income" value="180000" step="1000" required>
                    </div>

                    <div class="form-group">
                        <label for="credit">Credit Amount Requested ($)</label>
                        <input type="number" id="credit" name="credit" value="450000" step="1000" required>
                    </div>

                    <div class="form-group">
                        <label for="annuity">Annual Annuity Payment ($)</label>
                        <input type="number" id="annuity" name="annuity" value="22500" step="500" required>
                    </div>

                    <div class="form-group">
                        <label for="goods_price">Goods / Property Price ($)</label>
                        <input type="number" id="goods_price" name="goods_price" value="400000" step="1000" required>
                    </div>

                    <div class="form-group">
                        <label for="age_years">Applicant Age (Years)</label>
                        <input type="number" id="age_years" name="age_years" value="38" step="1" required>
                    </div>

                    <div class="form-group">
                        <label for="employed_years">Years in Current Employment</label>
                        <input type="number" id="employed_years" name="employed_years" value="6" step="0.5" required>
                    </div>

                    <div class="form-group">
                        <label for="gender">Gender</label>
                        <select id="gender" name="gender">
                            <option value="F">Female</option>
                            <option value="M">Male</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="contract_type">Contract Type</label>
                        <select id="contract_type" name="contract_type">
                            <option value="Cash loans">Cash loans</option>
                            <option value="Revolving loans">Revolving loans</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="income_type">Income Source</label>
                        <select id="income_type" name="income_type">
                            <option value="Working">Working / Salaried</option>
                            <option value="Commercial associate">Commercial Associate</option>
                            <option value="State servant">State Servant</option>
                            <option value="Pensioner">Pensioner</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="education">Education Level</label>
                        <select id="education" name="education">
                            <option value="Higher education">Higher education</option>
                            <option value="Secondary / secondary special" selected>Secondary / Secondary Special</option>
                            <option value="Incomplete higher">Incomplete higher</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="ext_source_2">External Bureau Rating 2 (0 to 1)</label>
                        <input type="number" id="ext_source_2" name="ext_source_2" value="0.55" min="0" max="1" step="0.01">
                    </div>

                    <div class="form-group">
                        <label for="ext_source_3">External Bureau Rating 3 (0 to 1)</label>
                        <input type="number" id="ext_source_3" name="ext_source_3" value="0.50" min="0" max="1" step="0.01">
                    </div>
                </div>

                <button type="submit" class="btn-submit">Evaluate Credit Application</button>
            </form>
        </div>

        <div class="meta-links">
            <a href="/docs" target="_blank">Swagger OpenAPI Docs</a> &bull;
            <a href="/health" target="_blank">Health Status</a>
        </div>
    </div>
</body>
</html>
